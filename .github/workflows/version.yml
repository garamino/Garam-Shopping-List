name: 🔢 Auto-increment Version

on:
  push:
    branches: [ main ]

jobs:
  bump-version:
    # Ne pas exécuter sur les commits automatiques de version
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔢 Générer la version du jour
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Date du jour: $TODAY"

          # Lire la version actuelle
          CURRENT=$(python3 -c "import sys,json; print(json.load(open('version.json'))['version'])")
          echo "Version actuelle: $CURRENT"

          # Extraire la date et le numéro de la version courante
          CURRENT_DATE=$(echo "$CURRENT" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || echo "")
          CURRENT_NUM=$(echo "$CURRENT" | grep -oE '[0-9]+$' || echo "0")

          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            # Même jour → incrémenter le numéro
            NEW_NUM=$((10#$CURRENT_NUM + 1))
          else
            # Nouveau jour → repartir à 001
            NEW_NUM=1
          fi

          NEW_VERSION=$(printf "%s-%03d" "$TODAY" "$NEW_NUM")
          echo "Nouvelle version: $NEW_VERSION"

          # Mettre à jour version.json
          echo "{\"version\": \"$NEW_VERSION\"}" > version.json

          # Mettre à jour le CACHE_NAME dans service-worker.js
          sed -i "s/const CACHE_NAME = 'liste-courses-v[^']*'/const CACHE_NAME = 'liste-courses-v$NEW_VERSION'/" service-worker.js

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: 📤 Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json service-worker.js
          git commit -m "v${{ env.NEW_VERSION }} [skip ci]"
          git push
